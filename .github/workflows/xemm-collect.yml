name: xemm-collect

# Public market data only: order books and trade prints. No secrets, no orders.
# A push that touches this file starts a run (workflow_dispatch only works from the
# default branch). RUN_LABEL below names the run.
env:
  RUN_LABEL: observation

on:
  push:
    branches: [claude/project-thread-wn12i9]
    paths: [".github/workflows/xemm-collect.yml"]
  workflow_dispatch:
    inputs:
      minutes:
        description: "Collection length in minutes"
        default: "60"
      label:
        description: "Run label (observation / validation)"
        default: "observation"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r arb/requirements.txt
      - run: python -m pytest -q arb/tests
      - name: Collect books and trades
        run: |
          mkdir -p data
          python -m arb.collector --minutes "${{ github.event.inputs.minutes || '60' }}" --interval 0.25 \
            --venues kraken,coinbase,okx,bitstamp,gemini,kucoin \
            --symbols BTC/USDT,ETH/USDT,SOL/USDT,XRP/USDT \
            --trades data/trades.jsonl.gz --out data/books.jsonl.gz > data/collector.log 2>&1 || true
          grep -E " (INFO|ERROR) " data/collector.log | grep -v "Exception in callback" | cut -c1-260 | head -60
          tail -1 data/collector.log | cut -c1-2000
          ls -la data
      - name: Simulate market making
        run: python -m arb.xemm_sim data/books.jsonl.gz data/trades.jsonl.gz --out data/xemm.json
      - uses: actions/upload-artifact@v4
        with:
          name: xemm-${{ github.event.inputs.label || env.RUN_LABEL }}-${{ github.run_id }}
          path: |
            data/xemm.json
            data/collector.log
          retention-days: 14
