name: arb-test

on:
  push:
    branches: [claude/project-thread-wn12i9]
    paths: ["arb/**", ".github/workflows/arb-test.yml"]
  pull_request:
    paths: ["arb/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r arb/requirements.txt
      - run: python -m pytest -q arb/tests
