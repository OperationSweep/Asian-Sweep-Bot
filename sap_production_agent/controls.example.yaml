# ---------------------------------------------------------------------------
# SAP GUI control IDs. Copy to controls.yaml and fill in.
#
# ZPRO is a custom transaction, so NOBODY can supply these - they exist only on
# your system. Get them by opening the relevant SAP screen and running:
#
#     python tools/discover_controls.py
#
# Every null below is a slot waiting for a real ID. Pre-flight lists the ones
# still empty, so you find out before a run rather than during one.
# ---------------------------------------------------------------------------

zpro:
  # Selection screen: where the work order number is typed.
  # Looks like wnd[0]/usr/ctxtP_AUFNR or wnd[0]/usr/txtCAUFVD-AUFNR
  work_order_field: null

  # Optional but strongly recommended: a field on the *opened* order that shows
  # the order number back. Used to confirm SAP is displaying the order we mean
  # before any serial is written. Without it that check is skipped.
  order_display_field: null

  # Button that opens/executes the order after the number is keyed.
  # Leave null to send Enter (or F8, per zpro.open_order_vkey in config.yaml).
  execute_button: null

  # The "+" control that expands Components View.
  components_expand_button: null

  # The table or ALV grid holding the components.
  # discover_controls.py shows its Type: GuiTableControl or GuiShell (ALV).
  serial_table: null

  # Serial Number column. For a GuiTableControl this is the column INDEX as a
  # number-in-a-string ("7"). For an ALV grid it is the column NAME ("SERNR").
  serial_column: null

  post_goods_issue_checkbox: null
  post_button: null

  # Button that dismisses the confirmation popup after posting.
  # Leave null to send Enter to wnd[1].
  confirm_button: null

co04:
  # Print mode. Either a radio button for Reprint, or a field taking a code.
  reprint_radio: null
  print_mode_field: null

  plant_field: null
  order_from_field: null
  order_to_field: null

  # Leave null to send F8.
  execute_button: null

  select_all_button: null

  # Optional: the results table, used to verify the document count matches the
  # number of orders posted before anything prints.
  results_table: null

  print_button: null

  # The SAP print dialogue's confirm button, before Windows takes over.
  print_dialog_confirm: null
